name: 기능 제안
description: 있으면 좋겠는 기능이나 개선 아이디어를 알려 주세요.
title: "[제안] "
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 어떤 기능/변경을 원하시나요?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 왜 필요한가요?
      description: 연습할 때 어떤 상황에서 불편했는지, 이 기능이 있으면 무엇이 좋아지는지 적어 주세요.
    validations:
      required: true
