name: 버그 제보
description: 앱이 예상대로 동작하지 않을 때 알려 주세요.
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다! 아래 내용을 채워 주시면 원인을 찾는 데 큰 도움이 됩니다.
  - type: input
    id: app_version
    attributes:
      label: 앱 버전
      description: 앱 설정/정보 화면 또는 설치한 APK 파일 이름에서 확인할 수 있습니다.
      placeholder: 예) 0.2.5
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 기기 / Android 버전
      placeholder: 예) Galaxy S23, Android 14
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 단계
      description: 문제가 생기기까지 어떤 순서로 조작했는지 적어 주세요.
      placeholder: |
        1. ＋ 버튼을 눌러 곡을 가져옴
        2. 분리 시작
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스크린샷 (선택)
      description: 스크린샷이나 화면 녹화를 끌어다 놓아 첨부할 수 있습니다. 개인정보가 포함되지 않았는지 확인해 주세요.
    validations:
      required: false
